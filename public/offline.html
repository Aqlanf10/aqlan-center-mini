<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>غير متصل — عيادة عقلان</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: "IBM Plex Sans Arabic", "Noto Sans Arabic", system-ui, sans-serif;
        background: #f1f5f9; color: #0d2137;
      }
      .card {
        max-width: 420px; margin: 16px; padding: 32px; text-align: center;
        background: #fff; border: 1px solid #e2e8f0; border-radius: 24px;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.8; color: #64748b; margin: 0 0 20px; }
      button {
        border: 0; border-radius: 12px; padding: 10px 20px; font: inherit; font-weight: 700;
        background: #0d2137; color: #fff; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>انقطع الاتصال</h1>
      <p>
        هذه الشاشة ليست بيانات، ولا أرقامًا قديمة تُعرض بصمت. الشاشات الحيّة تعود
        فور عودة الاتصال — أعد المحاولة، أو تحقق من الشبكة أولًا.
      </p>
      <button onclick="location.reload()">إعادة المحاولة</button>
    </div>
  </body>
</html>
