name: Focused payroll journal checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/hr-payroll.ts'
      - 'lib/hr-contracts-attendance.ts'
      - 'lib/postgres-date-only.ts'
      - '__tests__/postgres-date-only.test.ts'
      - 'lib/accounting.ts'
      - 'lib/db.ts'
      - 'lib/money.ts'
      - '__tests__/accounting-payable-accounts.test.ts'
      - '__tests__/postgres/payroll-journal-settlement.test.ts'
      - '__tests__/postgres/hr-payroll-*.test.ts'
      - 'package*.json'
      - '.github/workflows/payroll-journal-focused.yml'
  push:
    branches: [main]
    paths:
      - 'lib/hr-payroll.ts'
      - 'lib/hr-contracts-attendance.ts'
      - 'lib/postgres-date-only.ts'
      - '__tests__/postgres-date-only.test.ts'
      - 'lib/accounting.ts'
      - 'lib/db.ts'
      - 'lib/money.ts'
      - '__tests__/accounting-payable-accounts.test.ts'
      - '__tests__/postgres/payroll-journal-settlement.test.ts'
      - '__tests__/postgres/hr-payroll-*.test.ts'
      - 'package*.json'
      - '.github/workflows/payroll-journal-focused.yml'

permissions:
  contents: read

concurrency:
  group: payroll-journal-focused-${{ github.ref }}
  cancel-in-progress: true

# Supplemental early feedback only. The complete CI workflow stays mandatory
# and unchanged, including all PostgreSQL, HTTP, audit and production-build gates.
jobs:
  payroll-journal-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        timezone: [UTC, Asia/Aden, America/New_York]
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: aqlan_p1_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d aqlan_p1_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/aqlan_center_ci?sslmode=disable
      TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/aqlan_p1_test?sslmode=disable
      SESSION_SECRET: ci-placeholder-secret-0123456789abcdef
      CLINIC_TIME_ZONE: Asia/Aden
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Payable account unit regressions
        run: npm test -- __tests__/accounting-payable-accounts.test.ts __tests__/postgres-date-only.test.ts
      - name: Real PostgreSQL payroll journal regressions
        run: npm run test:postgres -- __tests__/postgres/payroll-journal-settlement.test.ts __tests__/postgres/hr-payroll-financial.test.ts __tests__/postgres/hr-payroll-integrity.test.ts __tests__/postgres/hr-schedule-occurrences.test.ts __tests__/postgres/hr-workforce-integrity.test.ts
