          path: ${{ steps.http_evidence_owners.outputs.evidence_service_raw_category_display_ui_paths }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # Exact synthetic read-only Account comparison: no cookies, storage values,
      # traces, HAR, broad directories or historical financial writes.
      - name: Upload legacy reconciliation preview evidence
        if: always() && steps.http_evidence_owners.outputs.evidence_legacy_reconciliation_preview_ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: legacy-reconciliation-preview-ui-${{ matrix.shard }}
          path: ${{ steps.http_evidence_owners.outputs.evidence_legacy_reconciliation_preview_ui_paths }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # Exactly two synthetic Cases navigation screenshots and target/occlusion bounds.
      # No traces, HAR, cookies, browser state, real records or broad uploads.
      - name: Upload Cases orthodontic section navigation evidence
        if: always() && steps.http_evidence_owners.outputs.evidence_patient_cases_navigation_ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: patient-cases-navigation-ui-${{ matrix.shard }}
          path: ${{ steps.http_evidence_owners.outputs.evidence_patient_cases_navigation_ui_paths }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # Exact synthetic chart-ready/error regions and Retry bounds only.
      # No traces, HAR, cookies, storage, broad directories or clinical writes.
      - name: Upload dental chart read and retry evidence
        if: always() && steps.http_evidence_owners.outputs.evidence_dental_chart_read_retry_ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dental-chart-read-retry-ui-${{ matrix.shard }}
          path: ${{ steps.http_evidence_owners.outputs.evidence_dental_chart_read_retry_ui_paths }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # Exact synthetic prescription cards and text bounds only. No traces, HAR,
      # cookies, browser state, real records, or broad artifact directories.
      - name: Upload orthodontic prescription truth evidence
        if: always() && steps.http_evidence_owners.outputs.evidence_ortho_prescription_truth_ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ortho-prescription-truth-ui-${{ matrix.shard }}
          path: ${{ steps.http_evidence_owners.outputs.evidence_ortho_prescription_truth_ui_paths }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # Only synthetic default-service/duration controls and their geometry.
      - name: Upload orthodontic booking default evidence
        if: always() && steps.http_evidence_owners.outputs.evidence_ortho_booking_default_ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ortho-booking-default-ui-${{ matrix.shard }}
          path: ${{ steps.http_evidence_owners.outputs.evidence_ortho_booking_default_ui_paths }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # Only synthetic recall refusal/retry panels and their native bounds.
      - name: Upload recall mutation refusal evidence
        if: always() && steps.http_evidence_owners.outputs.evidence_recall_mutation_refusal_ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: recall-mutation-refusal-ui-${{ matrix.shard }}
          path: ${{ steps.http_evidence_owners.outputs.evidence_recall_mutation_refusal_ui_paths }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7


      # Only synthetic patient lab refusal/retry viewports and measured bounds.
      # No cookies, storage, HAR, traces, real patients or broad directories.
      - name: Upload patient lab status refusal evidence
        if: always() && steps.http_evidence_owners.outputs.evidence_patient_lab_status_refusal_ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: patient-lab-status-refusal-ui-${{ matrix.shard }}
          path: ${{ steps.http_evidence_owners.outputs.evidence_patient_lab_status_refusal_ui_paths }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Actual shared contract components, synthetic fixtures only. No app session,
  # database, customer PDF or external network is used by the renderer.
  contract_print_visual:
    permissions:
      contents: read
    name: Synthetic contract print and watermark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install hosted Chromium
        run: npx playwright install --with-deps chromium
      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends poppler-utils
      - name: Render and verify synthetic short and multipage contracts
        run: npm run test:contract-print
      # Only this deterministic synthetic renderer's PDF/PNG/geometry outputs.
      # Never upload browser state, traces, cookies, private references or DBs.
      - name: Upload synthetic contract print evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-installment-contract-print
          path: |
            .settings-ui-artifacts/official-contract-print/*.pdf
            .settings-ui-artifacts/official-contract-print/*.png
            .settings-ui-artifacts/official-contract-print/*.json
            .settings-ui-artifacts/unified-print/*.pdf
            .settings-ui-artifacts/unified-print/*.png
            .settings-ui-artifacts/unified-print/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # Exact synthetic full-study outputs only; no refusal samples, traces,
      # cookies, raw logs, browser state, patient data or directory wildcards.
      - name: Upload synthetic full-study print evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ortho-full-study-print
          path: |
            .settings-ui-artifacts/ortho-full-print/all-layouts.pdf
            .settings-ui-artifacts/ortho-full-print/collage-wide.pdf
            .settings-ui-artifacts/ortho-full-print/all-layouts-first.png
            .settings-ui-artifacts/ortho-full-print/collage-wide-first.png
            .settings-ui-artifacts/ortho-full-print/all-layouts-mapping.json
            .settings-ui-artifacts/ortho-full-print/collage-wide-mapping.json
            .settings-ui-artifacts/ortho-full-print/all-layouts-geometry.json
            .settings-ui-artifacts/ortho-full-print/collage-wide-geometry.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # A failed, skipped or cancelled required job never produces a green gate.
  required_completion:
    name: Required CI gates (fail closed)
    if: always()
    needs: [quality, postgres_integration, security_http, contract_print_visual]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all required jobs finished successfully
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          POSTGRES_RESULT: ${{ needs.postgres_integration.result }}
          HTTP_RESULT: ${{ needs.security_http.result }}
          PRINT_RESULT: ${{ needs.contract_print_visual.result }}
        run: |
          if [ "$QUALITY_RESULT" != "success" ] || [ "$POSTGRES_RESULT" != "success" ] || [ "$HTTP_RESULT" != "success" ] || [ "$PRINT_RESULT" != "success" ]; then
            echo "::error::Required CI incomplete: quality=$QUALITY_RESULT, postgres_integration=$POSTGRES_RESULT, security_http=$HTTP_RESULT, contract_print_visual=$PRINT_RESULT"
            exit 1
          fi
