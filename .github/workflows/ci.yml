name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**", "hardening/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, Lint, Unit, Audit, Build
    runs-on: ubuntu-latest
    # Code/unit/audit/build gates; DB integration and hosted HTTP have isolated runners.
    timeout-minutes: 75

    env:
      # Build and unit tests do not open a database connection. The placeholder
      # prevents accidental use of a real Railway URL in CI.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/aqlan_center_ci?sslmode=disable
      # اختبارات تكامل PostgreSQL الحقيقية (test:postgres) — قاعدة الخدمة المعزولة.
      TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/aqlan_p1_test?sslmode=disable
      SESSION_SECRET: ci-placeholder-secret-0123456789abcdef
      CLINIC_TIME_ZONE: Asia/Aden

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # npm bundled with Node 22 still calls the retired quick-audit endpoint
      # (POST /-/npm/v1/security/audits/quick), which the npm registry now
      # answers with 400 Bad Request — the audit step then fails with no
      # vulnerability at all. npm v11 uses the replacement bulk advisory
      # endpoint, so the audit keeps guarding dependencies as before.
      - name: Upgrade npm to bulk advisory endpoint
        run: npm install -g npm@11.21.1

      - name: Install locked dependencies
        run: npm ci

      # (TD-02) عقد البيئة قبل أي بوابة: إصدار Node داخل العقد، npm داخل النطاق،
      # التوقيت التعاقدي Asia/Aden، وروابط القواعد محلية آمنة — يفشل مغلقًا عند
      # أول انجراف بين ملفات العقد (engines/.nvmrc/CI) نفسها. ساكن بالكامل:
      # لا يفتح قاعدة ولا ينزّل شيئًا.
      - name: Verify environment contract
        run: npm run verify:environment

      # The complete application/test graph exceeds Node's default ~2 GiB heap.
      # Scope the larger limit to this gate; verify actual runner/cgroup headroom
      # first rather than skipping files or making compiler diagnostics optional.
      - name: Verify full typecheck memory capacity
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: node scripts/typecheck-memory.mjs

      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run typecheck

      # Phase 1A introduced ESLint primarily as a correctness guardrail
      # (not a formatting campaign). Keep it mandatory in CI so hook-rule
      # regressions cannot pass typecheck/build unnoticed.
      - name: Lint
        run: npm run lint

      # (P-01) حارس تجميع المال — لا جمع عبر العملات في كود المنتج: أي SUM
      # على أعمدة المال بلا بعد العملة يفشل البناء (انحدار P0-1).
      - name: Money aggregation guard
        run: npm run scan:money

      - name: Unit tests
        run: npm test

      - name: Dependency audit
        # Preserve complete raw reports. Only the exact reviewed braces advisory
        # may receive a disposition after independent fail-closed verification;
        # every other advisory, malformed report or failed lookup blocks.
        run: node --import tsx scripts/ci-audit.mjs

      - name: Upload exact dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoped-dependency-audit
          path: |
            .dependency-audit/full-attempt-1.json
            .dependency-audit/full-attempt-1.stderr.txt
            .dependency-audit/full-attempt-1.process.json
            .dependency-audit/full-attempt-2.json
            .dependency-audit/full-attempt-2.stderr.txt
            .dependency-audit/full-attempt-2.process.json
            .dependency-audit/full-attempt-3.json
            .dependency-audit/full-attempt-3.stderr.txt
            .dependency-audit/full-attempt-3.process.json
            .dependency-audit/production-attempt-1.json
            .dependency-audit/production-attempt-1.stderr.txt
            .dependency-audit/production-attempt-1.process.json
            .dependency-audit/production-attempt-2.json
            .dependency-audit/production-attempt-2.stderr.txt
            .dependency-audit/production-attempt-2.process.json
            .dependency-audit/production-attempt-3.json
            .dependency-audit/production-attempt-3.stderr.txt
            .dependency-audit/production-attempt-3.process.json
            .dependency-audit/exception-proof.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # (P2-FIX-2) عدّاء انحدار قارئات الأجسام — إلزامي: أي request.json()
      # خام في app/api يفشل البناء؛ كل القراءة عبر readJsonBody المحدود (S8).
      - name: Raw body parser scanner
        run: npm run ci:scan:body

      # Next runs a separate full-project TypeScript CLI during production build.
      # Earlier step-local NODE_OPTIONS do not carry into this mandatory check.
      - name: Verify production build typecheck memory capacity
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: node scripts/typecheck-memory.mjs

      - name: Production build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Build and smoke-test read-only preflight artifact
        run: npm run build:preflight

      - name: Verify braces absence in actual runtime artifacts
        run: node scripts/verify-braces-runtime.mjs

      - name: Verify lint tooling absence in actual runtime artifacts
        run: node scripts/dependency-security/verify-lint-tooling-runtime.mjs

      - name: Upload exact runtime dependency proof
        uses: actions/upload-artifact@v4
        with:
          name: braces-runtime-absence
          path: |
            .dependency-audit/runtime-proof.json
            .dependency-audit/lint-tooling-runtime-proof.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7


  # DB tests, schema provenance and operational DB journeys run on their own
  # disposable PostgreSQL 18 service; never against a deployed clinic database.
  postgres_integration:
    name: PostgreSQL 18 integration, schema and operational journeys
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      # (P1.3/P1.22) PostgreSQL حقيقي لاختبارات التكامل والتزامن والاستعادة —
      # ليست اختيارية: التزامن المالي لا يُثبت على PGlite أحادي الاتصال.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: aqlan_p1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Build and unit tests do not open a database connection. The placeholder
      # prevents accidental use of a real Railway URL in CI.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/aqlan_center_ci?sslmode=disable
      # اختبارات تكامل PostgreSQL الحقيقية (test:postgres) — قاعدة الخدمة المعزولة.
      TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/aqlan_p1_test?sslmode=disable
      SESSION_SECRET: ci-placeholder-secret-0123456789abcdef
      CLINIC_TIME_ZONE: Asia/Aden

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Upgrade npm to bulk advisory endpoint
        run: npm install -g npm@11.21.1
      - name: Install locked dependencies
        run: npm ci
      - name: Verify environment contract
        run: npm run verify:environment
      - name: Verify isolated PostgreSQL 18 server version
        run: |
          node --input-type=module <<'NODE'
          import {Client} from 'pg';
          const u = new URL(process.env.TEST_DATABASE_URL);
          if (u.hostname !== '127.0.0.1' || u.port !== '5432' || u.pathname !== '/aqlan_p1_test') {
            throw new Error('Unexpected PostgreSQL integration target');
          }
          const c = new Client({connectionString:u.toString(),ssl:false});
          await c.connect();
          try {
            const r = await c.query('SHOW server_version_num');
            if (Math.floor(Number(r.rows[0].server_version_num)/10000) !== 18) throw new Error('PostgreSQL 18 required');
          } finally { await c.end(); }
          NODE
      - name: PostgreSQL integration tests
        env:
          # Explicit fixture reset opt-in for this disposable service database only.
          # Standalone category-history proof and ordinary invocations refuse nonempty schemas.
          CATEGORY_HISTORY_CI_DISPOSABLE_FIXTURE: "1"
          MANUAL_CASH_CI_DISPOSABLE_FIXTURE: "1"
        # P1.22: إلزامي لا اختياري — إثبات التزامن المالي (الإقرارات، الدفعات،
        # الردود، WAC) وتدريب الاستعادة على قاعدة حقيقية معزولة.
        run: npm run test:postgres

      # (P0) رحلات التحقق التشغيلية — إلزامية لا اختيارية.
      #
      # الأنواعُ والاختباراتُ والبناءُ تُثبت أن البرنامج **يُترجم**، لا أنه يعمل. وقد
      # كان هذا الفحص يخضرّ بينما خمسٌ من ثماني عشرة رحلةً تشغيلية ساقطة — لأنه لم
      # يكن يشغّل أيًّا منها. `verify:ci` يشغّلها كلها بترتيب مراحلها ويفشل البناء
      # إن سقطت واحدة أو تُخطّيت لنقص بيئة.
      #
      # DATABASE_URL هنا قاعدةُ الصيانة `postgres` لا قاعدةُ بيانات: كل رحلةٍ تنشئ
      # قاعدتها المؤقتة باسمٍ فريد وتهدمها في finally، فلا تلمس شيئًا مشتركًا ولا
      # تتنازع رحلتان صفًّا واحدًا.
      # عقد المخطط الحالي يُولَّد هنا على PostgreSQL 18 — عقد الاختبار/التطوير/
      # التدرّج المدعوم (major الإنتاج على Railway غير مثبتٍ من المستودع ولا
      # يُدَّعى) — ويُرفع أثرًا. والبوّابة نفسها في verify:schema أدناه.
      # (التصحيح النهائي) المقارنة البنيوية الحتمية قبل الاستعادة: النسخة
      # الطازجة تقابل الملتزم من HEAD — أي فرقٍ بنيوي (جدول/عمود/نوع/قيد/
      # فهرس/مُشغِّل/عدّاد) يُفشل البناء بـ SCHEMA_CONTRACT_DRIFT قبل أن
      # يستعاد الملف الملتزم بشجرة العمل. مصدر minor للخادم (18.4 مقابل 18.6)
      # لا يُفشل وحده — البنية هي المقيس.
      - name: Generate current schema contract on PostgreSQL 18
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/postgres?sslmode=disable
        run: |
          git show HEAD:schema/current-schema-contract.pg18.json > /tmp/committed-schema-contract.pg18.json
          npm run schema:contract
          cp schema/current-schema-contract.pg18.json /tmp/current-schema-contract.pg18.json
          npm run schema:contract:verify -- --fresh /tmp/current-schema-contract.pg18.json --committed /tmp/committed-schema-contract.pg18.json
          git checkout -- schema/current-schema-contract.pg18.json

      - name: Upload PostgreSQL 18 schema contract
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-schema-contract-pg18
          path: /tmp/current-schema-contract.pg18.json
          if-no-files-found: error
          retention-days: 7

      - name: Characterize schema ownership on ephemeral PostgreSQL 18
        env:
          SCHEMA_OWNERSHIP_SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run schema:ownership:verify -- --output /tmp/schema-ownership-characterization.json

      - name: Upload schema ownership characterization
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-ownership-characterization-pg18
          path: /tmp/schema-ownership-characterization.json
          # Earlier mandatory gates can stop before characterization creates the file.
          # The characterization step itself remains fail-closed when it runs.
          if-no-files-found: warn
          retention-days: 7

      - name: Operational verification journeys
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/postgres?sslmode=disable
        run: npm run verify:ci

      # Final Production Gate: bootstrap a deterministic baseline manifest on
      # the supported CI/test/staging contract major (PostgreSQL 18). This step
      # uses only the CI DB; the generated file is an artifact for provenance,
      # not deployed. The production PostgreSQL major on Railway is NOT
      # verified from this repository and is deliberately not claimed here.
      - name: Generate PostgreSQL 18 baseline manifest candidate
        run: npm run db:baseline:manifest -- --output /tmp/baseline-schema-manifest.json

      # المرجع الثابت هو الملف الملتزم schema/baseline-schema-manifest.pg18.json:
      # أي اختلاف بين توليد 0001 الطازج والملف الملتزم يفشل CI — تعديل 0001
      # يتطلب إعادة توليد الملف واعتمادها بمراجعة صريحة.
      - name: Verify committed baseline manifest against fresh generation
        run: npm run db:baseline:manifest:verify -- --fresh /tmp/baseline-schema-manifest.json

      - name: Upload baseline manifest candidate
        uses: actions/upload-artifact@v4
        with:
          name: baseline-schema-manifest-pg18
          path: /tmp/baseline-schema-manifest.json
          if-no-files-found: error
          retention-days: 7


  # Hosted browser/HTTP starts only after the independently required code/build gate.
  # It still rebuilds in its own runner with its own disposable PostgreSQL service.
  # Nothing from the serial security suite is omitted or marked continue-on-error.
  security_http:
    name: Built-app HTTP security and hosted browser (${{ matrix.shard }}/2)
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: aqlan_p1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/aqlan_center_ci?sslmode=disable
      TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/aqlan_p1_test?sslmode=disable
      SESSION_SECRET: ci-placeholder-secret-0123456789abcdef
      CLINIC_TIME_ZONE: Asia/Aden
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Upgrade npm to bulk advisory endpoint
        run: npm install -g npm@11.21.1
      - name: Install locked dependencies
        run: npm ci
      - name: Verify environment contract
        run: npm run verify:environment
      # This isolated runner repeats Next's full-project TypeScript check.
      # Recheck runner/cgroup headroom and scope the heap just as in quality.
      - name: Verify built-app HTTP build typecheck memory capacity
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: node scripts/typecheck-memory.mjs

      - name: Assign test and evidence ownership for this HTTP shard
        id: http_evidence_owners
        run: node scripts/dependency-security/http-evidence-ownership.mjs --assign ${{ matrix.shard }}
      - name: Production build for built-app HTTP tests
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build
      - name: Build read-only preflight artifact for HTTP runtime verification
        run: npm run build:preflight
      - name: Verify built-app runtime dependency boundaries
        run: |
          node scripts/verify-braces-runtime.mjs
          node scripts/dependency-security/verify-lint-tooling-runtime.mjs
      # (P2/S14) اختبارات الأمن على HTTP الحقيقي — إلزامية لا اختيارية:
      # رؤوس الأمن وCSP وnonce وCSRF/Origin وحدود الأجسام والمعدل ومصفوفة
      # RBAC/BOLA لا تُثبت إلا على تطبيق مبنيّ فعليًّا خلف HTTP حقيقي، على
      # القاعدة المعزولة نفسها (قاعدة خدمة CI) — لا في وحدات محاكاة.
      - name: Install Chromium for Settings browser journey
        run: npx playwright install --with-deps chromium

      - name: Install PDF text inspection tool
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends poppler-utils

      - name: HTTP security integration tests
        env:
          HR_EVIDENCE_DIR: /tmp/hr-evidence
        # Raw JSON stays runner-local. Preserve Vitest's original exit status.
        run: npm run test:security-http -- --reporter=default --reporter=json --includeTaskLocation --outputFile.json="$RUNNER_TEMP/http-main-raw.json" --shard=${{ matrix.shard }}/2

      - name: Sanitize security HTTP test locations
        if: always()
        run: node scripts/sanitize-http-test-report.mjs "${{ runner.temp }}/http-main-raw.json" "${{ runner.temp }}/http-security-locations.json"

      # Runs after the locations sanitizer: the index collector deletes the raw report.
      - name: Collect sanitized main HTTP failure index
        id: http_main_index
        if: always()
        run: node scripts/dependency-security/http-failure-index.mjs main

      - name: Upload sanitized main HTTP failure index
        if: always() && steps.http_main_index.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: http-main-failure-index-${{ matrix.shard }}
          path: .http-failure-index/main.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

      - name: Upload security HTTP test locations only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http-security-test-locations-${{ matrix.shard }}
          path: ${{ runner.temp }}/http-security-locations.json
          if-no-files-found: error
          retention-days: 7

      - name: Isolated inventory proposal HTTP tests (explicit opt-in)
        env:
          INVENTORY_SCHEMA_TEST: "1"
        # Raw JSON stays runner-local. Preserve Vitest's original exit status.
        run: npm run test:security-http -- --reporter=default --reporter=json --includeTaskLocation --outputFile.json="$RUNNER_TEMP/http-inventory-raw.json"

      - name: Sanitize inventory HTTP test locations
        if: always()
        run: node scripts/sanitize-http-test-report.mjs "${{ runner.temp }}/http-inventory-raw.json" "${{ runner.temp }}/http-inventory-locations.json"

      - name: Collect sanitized inventory HTTP failure index
        id: http_inventory_index
        if: always()
        run: node scripts/dependency-security/http-failure-index.mjs inventory

      - name: Upload sanitized inventory HTTP failure index
        if: always() && steps.http_inventory_index.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: http-inventory-failure-index-${{ matrix.shard }}
          path: .http-failure-index/inventory.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

      - name: Upload inventory HTTP test locations only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http-inventory-test-locations-${{ matrix.shard }}
          path: ${{ runner.temp }}/http-inventory-locations.json
          if-no-files-found: error
          retention-days: 7

      - name: Require every evidence path owned by this HTTP shard
        if: always() && steps.http_evidence_owners.outcome == 'success'
        run: node scripts/dependency-security/http-evidence-ownership.mjs --verify ${{ matrix.shard }}

      # Four pristine unauthenticated login views only, before any credentials.
      # Never upload cookies, browser storage, traces, videos, or broad directories.
      - name: Upload official-identity login screenshots
        if: always() && steps.http_evidence_owners.outputs.evidence_login_reference_ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: login-reference-ui-${{ matrix.shard }}
          path: ${{ steps.http_evidence_owners.outputs.evidence_login_reference_ui_paths }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # Five exact real-app synthetic invoice views and bounded geometry only.
      # No browser state, cookies, traces, databases, or broad directory upload.
      - name: Upload grouped invoice entry evidence
        if: always() && steps.http_evidence_owners.outputs.evidence_invoice_grouped_entry_ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: invoice-grouped-entry-ui-${{ matrix.shard }}
          path: ${{ steps.http_evidence_owners.outputs.evidence_invoice_grouped_entry_ui_paths }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload leadership hub synthetic visual and loading evidence
        if: always() && steps.http_evidence_owners.outputs.evidence_leadership_hub_ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: leadership-hub-ui-${{ matrix.shard }}
          path: ${{ steps.http_evidence_owners.outputs.evidence_leadership_hub_ui_paths }}
          if-no-files-found: error
          retention-days: 7

      # Exactly four actual-viewport screenshots from the owned synthetic fixture.
      # No cookies, browser state, traces, database dumps, or clinic records.
      - name: Upload laboratory backlog desktop and mobile evidence
        if: always() && steps.http_evidence_owners.outputs.evidence_lab_open_backlog_ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lab-open-backlog-ui-${{ matrix.shard }}
          path: ${{ steps.http_evidence_owners.outputs.evidence_lab_open_backlog_ui_paths }}
          if-no-files-found: error
          retention-days: 7

      # Explicit synthetic HR viewports/PDFs only; no browser state, cookies,
      # traces, database dumps or employee data from an external environment.
      - name: Upload employee workflow evidence
        if: always() && steps.http_evidence_owners.outputs.evidence_hr_workflow_ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hr-workflow-ui-${{ matrix.shard }}
          path: ${{ steps.http_evidence_owners.outputs.evidence_hr_workflow_ui_paths }}
          if-no-files-found: error
          retention-days: 7

      # Exactly three intercepted synthetic report screenshots; no live clinic data,
      # traces, browser storage, or broad artifact directory uploads.
      - name: Upload daily report selected-date screenshots
        if: always() && steps.http_evidence_owners.outputs.evidence_daily_report_selected_date_ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-selected-date-ui-${{ matrix.shard }}
          path: ${{ steps.http_evidence_owners.outputs.evidence_daily_report_selected_date_ui_paths }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # Exact synthetic daily-report design evidence only: viewport captures at
      # 1280/390 with a 320 boundary check, the four state screens, and the real
      # paginated A4 PDF. No live clinic data, traces, or broad directory uploads.
      - name: Upload daily report design evidence
        if: always() && steps.http_evidence_owners.outputs.evidence_daily_report_design_ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-design-ui-${{ matrix.shard }}
          path: ${{ steps.http_evidence_owners.outputs.evidence_daily_report_design_ui_paths }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # Exact synthetic statement fixtures only; never upload real patient ledgers.
      - name: Upload patient statement cutoff screenshots
        if: always() && steps.http_evidence_owners.outputs.evidence_patient_statement_cutoff_ui == 'true'
