name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**", "hardening/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, Test, Postgres, Audit, Build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      # PostgreSQL حقيقي مطابق للإصدار الرئيسي المستخدم في Railway Production.
      # التزامن المالي والهجرات والاستعادة لا تُثبت على PGlite أحادي الاتصال.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: aqlan_p1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/aqlan_center_ci?sslmode=disable
      TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/aqlan_p1_test?sslmode=disable
      SESSION_SECRET: ci-placeholder-secret-0123456789abcdef
      CLINIC_TIME_ZONE: Asia/Aden

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm to bulk advisory endpoint
        run: npm install -g npm@11

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: PostgreSQL integration tests
        run: npm run test:postgres

      - name: Dependency audit
        run: node --import tsx scripts/ci-audit.mjs

      - name: Raw body parser scanner
        run: npm run ci:scan:body

      - name: Production build
        run: npm run build

      - name: HTTP security integration tests
        run: npm run test:security-http
