name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/mvp-v1]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, Test, Audit, Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Build and unit tests do not open a database connection. The placeholder
      # prevents accidental use of a real Railway URL in CI.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/aqlan_center_ci?sslmode=disable
      SESSION_SECRET: ci-placeholder-secret-0123456789abcdef
      CLINIC_TIME_ZONE: Asia/Aden

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Production build
        run: npm run build
