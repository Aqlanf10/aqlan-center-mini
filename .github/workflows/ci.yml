# Generated from .github/ci/workflow.json; edit the graph, then render it.
name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/**
      - hardening/**
  workflow_dispatch: 
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security_early:
    name: Security and live dependency evidence
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/aqlan_center_ci?sslmode=disable
      TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/aqlan_p1_test?sslmode=disable
      SESSION_SECRET: ci-placeholder-secret-0123456789abcdef
      CLINIC_TIME_ZONE: Asia/Aden
      CI_EVENT_NAME: ${{ github.event_name }}
      CI_EVENT_SHA: ${{ github.sha }}
      CI_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CI_SOURCE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      CI_WORKFLOW_REF: ${{ github.workflow_ref }}
      CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
      CI_RUN_ID: ${{ github.run_id }}
      CI_RUN_ATTEMPT: ${{ github.run_attempt }}
      CI_REPOSITORY: ${{ github.repository }}
      CI_REF: ${{ github.ref }}
      CI_LANE: security_early
    outputs:
      receipt_id: ${{ steps.receipt_upload.outputs.artifact-id }}
      receipt_digest: ${{ steps.receipt_upload.outputs.artifact-digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        id: baseline_01
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
        id: baseline_02
      - name: Upgrade npm to bulk advisory endpoint
        run: npm install -g npm@11
        id: baseline_03
      - name: Install locked dependencies
        run: npm ci
        id: baseline_04
      - name: Verify environment contract
        run: npm run verify:environment
        id: baseline_05
      - name: Bind clean checkout and evidence identity
        id: evidence_init
        run: python3 .github/ci/evidence.py init
      - name: Dependency audit
        run: node --import tsx scripts/ci-audit.mjs
        id: baseline_19
      - name: Upload exact dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoped-dependency-audit--${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            .dependency-audit/full-attempt-1.json
            .dependency-audit/full-attempt-1.stderr.txt
            .dependency-audit/full-attempt-1.process.json
            .dependency-audit/full-attempt-2.json
            .dependency-audit/full-attempt-2.stderr.txt
            .dependency-audit/full-attempt-2.process.json
            .dependency-audit/full-attempt-3.json
            .dependency-audit/full-attempt-3.stderr.txt
            .dependency-audit/full-attempt-3.process.json
            .dependency-audit/production-attempt-1.json
            .dependency-audit/production-attempt-1.stderr.txt
            .dependency-audit/production-attempt-1.process.json
            .dependency-audit/production-attempt-2.json
            .dependency-audit/production-attempt-2.stderr.txt
            .dependency-audit/production-attempt-2.process.json
            .dependency-audit/production-attempt-3.json
            .dependency-audit/production-attempt-3.stderr.txt
            .dependency-audit/production-attempt-3.process.json
            .dependency-audit/exception-proof.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
        id: baseline_20
      - name: Seal exact mandatory outcomes and artifact members
        id: seal
        if: always()
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 .github/ci/evidence.py seal
      - name: Upload immutable lane receipt
        id: receipt_upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-receipt-security_early--${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: .ci-evidence/receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  static_quality:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/aqlan_center_ci?sslmode=disable
      TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/aqlan_p1_test?sslmode=disable
      SESSION_SECRET: ci-placeholder-secret-0123456789abcdef
      CLINIC_TIME_ZONE: Asia/Aden
      CI_EVENT_NAME: ${{ github.event_name }}
      CI_EVENT_SHA: ${{ github.sha }}
      CI_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CI_SOURCE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      CI_WORKFLOW_REF: ${{ github.workflow_ref }}
      CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
      CI_RUN_ID: ${{ github.run_id }}
      CI_RUN_ATTEMPT: ${{ github.run_attempt }}
      CI_REPOSITORY: ${{ github.repository }}
      CI_REF: ${{ github.ref }}
      CI_LANE: static_quality
    outputs:
      receipt_id: ${{ steps.receipt_upload.outputs.artifact-id }}
      receipt_digest: ${{ steps.receipt_upload.outputs.artifact-digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        id: baseline_01
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
        id: baseline_02
      - name: Upgrade npm to bulk advisory endpoint
        run: npm install -g npm@11
        id: baseline_03
      - name: Install locked dependencies
        run: npm ci
        id: baseline_04
      - name: Verify environment contract
        run: npm run verify:environment
        id: baseline_05
      - name: Bind clean checkout and evidence identity
        id: evidence_init
        run: python3 .github/ci/evidence.py init
      - name: Validate workflow DAG and fail-closed fault controls
        id: ci_contract_tests
        run: |
          python3 .github/ci/workflow.py --check
          python3 -m unittest discover -s .github/ci/tests -p "test_*.py"
      - name: Typecheck
        run: npm run typecheck
        id: baseline_06
      - name: Lint
        run: npm run lint
        id: baseline_07
      - name: Money aggregation guard
        run: npm run scan:money
        id: baseline_08
      - name: Unit tests
        run: npm test
        id: baseline_09
      - name: Raw body parser scanner
        run: npm run ci:scan:body
        id: baseline_21
      - name: Seal exact mandatory outcomes and artifact members
        id: seal
        if: always()
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 .github/ci/evidence.py seal
      - name: Upload immutable lane receipt
        id: receipt_upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-receipt-static_quality--${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: .ci-evidence/receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  postgres_schema_journeys:
    name: PostgreSQL, schemas and operational journeys
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: aqlan_p1_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/aqlan_center_ci?sslmode=disable
      TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/aqlan_p1_test?sslmode=disable
      SESSION_SECRET: ci-placeholder-secret-0123456789abcdef
      CLINIC_TIME_ZONE: Asia/Aden
      CI_EVENT_NAME: ${{ github.event_name }}
      CI_EVENT_SHA: ${{ github.sha }}
      CI_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CI_SOURCE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      CI_WORKFLOW_REF: ${{ github.workflow_ref }}
      CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
      CI_RUN_ID: ${{ github.run_id }}
      CI_RUN_ATTEMPT: ${{ github.run_attempt }}
      CI_REPOSITORY: ${{ github.repository }}
      CI_REF: ${{ github.ref }}
      CI_LANE: postgres_schema_journeys
    outputs:
      receipt_id: ${{ steps.receipt_upload.outputs.artifact-id }}
      receipt_digest: ${{ steps.receipt_upload.outputs.artifact-digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        id: baseline_01
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
        id: baseline_02
      - name: Upgrade npm to bulk advisory endpoint
        run: npm install -g npm@11
        id: baseline_03
      - name: Install locked dependencies
        run: npm ci
        id: baseline_04
      - name: Verify environment contract
        run: npm run verify:environment
        id: baseline_05
      - name: Bind clean checkout and evidence identity
        id: evidence_init
        run: python3 .github/ci/evidence.py init
        env:
          CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - name: PostgreSQL integration tests
        env:
          CATEGORY_HISTORY_CI_DISPOSABLE_FIXTURE: "1"
          MANUAL_CASH_CI_DISPOSABLE_FIXTURE: "1"
        run: npm run test:postgres
        id: baseline_10
      - name: Generate current schema contract on PostgreSQL 18
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/postgres?sslmode=disable
        run: |
          git show HEAD:schema/current-schema-contract.pg18.json > /tmp/committed-schema-contract.pg18.json
          npm run schema:contract
          cp schema/current-schema-contract.pg18.json /tmp/current-schema-contract.pg18.json
          npm run schema:contract:verify -- --fresh /tmp/current-schema-contract.pg18.json --committed /tmp/committed-schema-contract.pg18.json
          git checkout -- schema/current-schema-contract.pg18.json
        id: baseline_11
      - name: Upload PostgreSQL 18 schema contract
        uses: actions/upload-artifact@v4
        with:
          name: current-schema-contract-pg18--${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: /tmp/current-schema-contract.pg18.json
          if-no-files-found: error
          retention-days: 7
        id: baseline_12
      - name: Characterize schema ownership on ephemeral PostgreSQL 18
        env:
          SCHEMA_OWNERSHIP_SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run schema:ownership:verify -- --output /tmp/schema-ownership-characterization.json
        id: baseline_13
      - name: Upload schema ownership characterization
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-ownership-characterization-pg18--${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: /tmp/schema-ownership-characterization.json
          if-no-files-found: warn
          retention-days: 7
        id: baseline_14
      - name: Operational verification journeys
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/postgres?sslmode=disable
        run: npm run verify:ci
        id: baseline_15
      - name: Generate PostgreSQL 18 baseline manifest candidate
        run: npm run db:baseline:manifest -- --output /tmp/baseline-schema-manifest.json
        id: baseline_16
      - name: Verify committed baseline manifest against fresh generation
        run: npm run db:baseline:manifest:verify -- --fresh /tmp/baseline-schema-manifest.json
        id: baseline_17
      - name: Upload baseline manifest candidate
        uses: actions/upload-artifact@v4
        with:
          name: baseline-schema-manifest-pg18--${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: /tmp/baseline-schema-manifest.json
          if-no-files-found: error
          retention-days: 7
        id: baseline_18
      - name: Seal exact mandatory outcomes and artifact members
        id: seal
        if: always()
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 .github/ci/evidence.py seal
      - name: Upload immutable lane receipt
        id: receipt_upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-receipt-postgres_schema_journeys--${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: .ci-evidence/receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
