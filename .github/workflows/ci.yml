          retention-days: 7
        id: clinical_delta_03
      - name: Seal exact mandatory outcomes and artifact members
        id: seal
        if: always()
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 .github/ci/evidence.py seal
      - name: Upload immutable lane receipt
        id: receipt_upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-receipt-build_http--${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: .ci-evidence/receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  quality:
    name: Typecheck, Lint, Test, Postgres, Audit, Build
    if: always()
    needs:
      - security_early
      - static_quality
      - postgres_schema_journeys
      - build_http
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
    env:
      CI_EVENT_NAME: ${{ github.event_name }}
      CI_EVENT_SHA: ${{ github.sha }}
      CI_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CI_SOURCE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      CI_WORKFLOW_REF: ${{ github.workflow_ref }}
      CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
      CI_RUN_ID: ${{ github.run_id }}
      CI_RUN_ATTEMPT: ${{ github.run_attempt }}
      CI_REPOSITORY: ${{ github.repository }}
      CI_REF: ${{ github.ref }}
    steps:
      - name: Check out exact event commit
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Verify complete fail-closed release evidence
        id: final_gate
        if: always()
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_GATE_STEPS_JSON: ${{ toJSON(steps) }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/ci/evidence.py gate
