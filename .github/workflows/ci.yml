name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, Test, Audit, Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Build and unit tests do not open a database connection. The placeholder
      # prevents accidental use of a real Railway URL in CI.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/aqlan_center_ci?sslmode=disable
      SESSION_SECRET: ci-placeholder-secret-0123456789abcdef
      CLINIC_TIME_ZONE: Asia/Aden

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Dependency audit
        # The npm registry's audit endpoint occasionally times out or returns
        # 5xx/400 errors unrelated to our dependencies (npm has been retiring
        # the legacy "quick audit" endpoint). Retry a few times with a bounded
        # per-attempt timeout, but fail immediately (no retry) when npm audit
        # actually reports vulnerabilities, so real findings still block CI.
        run: |
          attempt=1
          max_attempts=3
          while true; do
            if output=$(timeout 90 npm audit --audit-level=moderate 2>&1); then
              echo "$output"
              exit 0
            fi
            echo "$output"
            if echo "$output" | grep -qiE "audit endpoint returned an error|ECONNRESET|ETIMEDOUT|E(AI_)?AGAIN|5[0-9]{2} |400 Bad Request"; then
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::warning::npm audit failed after $max_attempts attempts due to a registry error, continuing without blocking the build"
                exit 0
              fi
              attempt=$((attempt + 1))
              sleep 10
            else
              # Real vulnerabilities (or another non-retriable failure): fail now.
              exit 1
            fi
          done

      - name: Production build
        run: npm run build
