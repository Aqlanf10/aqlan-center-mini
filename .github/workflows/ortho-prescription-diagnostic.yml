name: Supplemental ortho prescription diagnostic (non-release)

# Evidence gathering only. Full CI remains the release/integration requirement.
on:
  pull_request:
    branches: [fix/ortho-prescription-checklist-acceptance]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/ortho-prescription-diagnostic.yml
      - __tests__/security-http/ortho-prescription-truth-built-page.test.ts
      - components/PatientOrtho.tsx

permissions:
  contents: read

jobs:
  prescription-diagnostic:
    name: Supplemental prescription truth only (not a release gate)
    if: >-
      github.event.pull_request.number == 385 &&
      github.event.pull_request.head.ref == 'fix/ortho-prescription-phone-exposure' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: aqlan_p1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/aqlan_center_ci?sslmode=disable
      TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/aqlan_p1_test?sslmode=disable
      SESSION_SECRET: ci-placeholder-secret-0123456789abcdef
      CLINIC_TIME_ZONE: Asia/Aden
    steps:
      - name: Check out exact diagnostic head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Match CI npm major
        run: npm install -g npm@11
      - name: Install locked dependencies
        run: npm ci
      - name: Verify environment contract
        run: npm run verify:environment
      - name: Verify disposable PostgreSQL major
        run: |
          node --input-type=module <<'NODE'
          import { Client } from 'pg';
          const url = new URL(process.env.TEST_DATABASE_URL);
          if (url.hostname !== '127.0.0.1' || url.port !== '5432' || url.pathname !== '/aqlan_p1_test') {
            throw new Error('Unexpected diagnostic database target');
          }
          const db = new Client({ connectionString: url.toString(), ssl: false });
          await db.connect();
          try {
            const { rows } = await db.query('SHOW server_version_num');
            if (Math.floor(Number(rows[0].server_version_num) / 10000) !== 18) {
              throw new Error('Diagnostic requires PostgreSQL 18');
            }
          } finally { await db.end(); }
          NODE
      - name: Build production app for the existing HTTP harness
        run: npm run build
      - name: Install hosted Chromium
        run: npx playwright install --with-deps chromium
      - name: Run only prescription truth with unchanged assertions
        run: npm run test:security-http -- __tests__/security-http/ortho-prescription-truth-built-page.test.ts
