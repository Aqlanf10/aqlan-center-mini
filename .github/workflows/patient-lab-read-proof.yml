            .patient-lab-read-proof-results/candidate-before-ui/confirmed-empty-1280.png
            .patient-lab-read-proof-results/candidate-before-ui/confirmed-empty-1280-bounds.json
            .patient-lab-read-proof-results/candidate-before-ui/accepted-receipt-booking-1280.png
            .patient-lab-read-proof-results/candidate-before-ui/accepted-receipt-booking-1280-bounds.json
            .patient-lab-read-proof-results/candidate-before-ui/accepted-receipt-unavailable-1280.png
            .patient-lab-read-proof-results/candidate-before-ui/accepted-receipt-unavailable-1280-bounds.json
            .patient-lab-read-proof-results/candidate-before-status-ui/lab-status-refusal-1280.png
            .patient-lab-read-proof-results/candidate-before-status-ui/lab-status-retry-1280.png
            .patient-lab-read-proof-results/candidate-before-status-ui/lab-status-refusal-1280-bounds.json
            .patient-lab-read-proof-results/unit-original.json
            .patient-lab-read-proof-results/unit-original.stdout.txt
            .patient-lab-read-proof-results/unit-original.stderr.txt
            .patient-lab-read-proof-results/unit-original.process.json
            .patient-lab-read-proof-results/browser-original.json
            .patient-lab-read-proof-results/browser-original.stdout.txt
            .patient-lab-read-proof-results/browser-original.stderr.txt
