            .patient-lab-read-proof-results/unit-candidate-after.stdout.txt
            .patient-lab-read-proof-results/unit-candidate-after.stderr.txt
            .patient-lab-read-proof-results/unit-candidate-after.process.json
            .patient-lab-read-proof-results/browser-candidate-after.json
            .patient-lab-read-proof-results/browser-candidate-after.stdout.txt
            .patient-lab-read-proof-results/browser-candidate-after.stderr.txt
            .patient-lab-read-proof-results/browser-candidate-after.process.json
            .patient-lab-read-proof-results/build-candidate-after.stdout.txt
            .patient-lab-read-proof-results/build-candidate-after.stderr.txt
            .patient-lab-read-proof-results/build-candidate-after.process.json
            .patient-lab-read-proof-results/candidate-after.build.json
            .patient-lab-read-proof-results/extra-candidate-after.json
            .patient-lab-read-proof-results/extra-candidate-after.stdout.txt
            .patient-lab-read-proof-results/extra-candidate-after.stderr.txt
            .patient-lab-read-proof-results/extra-candidate-after.process.json
            .patient-lab-read-proof-results/candidate-after.evidence.json
            .patient-lab-read-proof-results/candidate-after-ui/unavailable-390.png
            .patient-lab-read-proof-results/candidate-after-ui/unavailable-390-bounds.json
            .patient-lab-read-proof-results/candidate-after-ui/confirmed-empty-390.png
            .patient-lab-read-proof-results/candidate-after-ui/confirmed-empty-390-bounds.json
            .patient-lab-read-proof-results/candidate-after-ui/accepted-receipt-booking-390.png
            .patient-lab-read-proof-results/candidate-after-ui/accepted-receipt-booking-390-bounds.json
            .patient-lab-read-proof-results/candidate-after-ui/accepted-receipt-unavailable-390.png
            .patient-lab-read-proof-results/candidate-after-ui/accepted-receipt-unavailable-390-bounds.json
            .patient-lab-read-proof-results/candidate-after-status-ui/lab-status-refusal-390.png
            .patient-lab-read-proof-results/candidate-after-status-ui/lab-status-retry-390.png
            .patient-lab-read-proof-results/candidate-after-status-ui/lab-status-refusal-390-bounds.json
            .patient-lab-read-proof-results/candidate-after-ui/unavailable-1280.png
            .patient-lab-read-proof-results/candidate-after-ui/unavailable-1280-bounds.json
            .patient-lab-read-proof-results/candidate-after-ui/confirmed-empty-1280.png
            .patient-lab-read-proof-results/candidate-after-ui/confirmed-empty-1280-bounds.json
            .patient-lab-read-proof-results/candidate-after-ui/accepted-receipt-booking-1280.png
            .patient-lab-read-proof-results/candidate-after-ui/accepted-receipt-booking-1280-bounds.json
            .patient-lab-read-proof-results/candidate-after-ui/accepted-receipt-unavailable-1280.png
            .patient-lab-read-proof-results/candidate-after-ui/accepted-receipt-unavailable-1280-bounds.json
            .patient-lab-read-proof-results/candidate-after-status-ui/lab-status-refusal-1280.png
            .patient-lab-read-proof-results/candidate-after-status-ui/lab-status-retry-1280.png
            .patient-lab-read-proof-results/candidate-after-status-ui/lab-status-refusal-1280-bounds.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Require actual proof and evidence upload success
        if: always()
        env:
          CHECKOUT_RESULT: ${{ steps.checkout.outcome }}
          NODE_RESULT: ${{ steps.node.outcome }}
          PREFLIGHT_RESULT: ${{ steps.preflight.outcome }}
          INSTALL_RESULT: ${{ steps.install.outcome }}
          CHROMIUM_RESULT: ${{ steps.chromium.outcome }}
          PROOF_RESULT: ${{ steps.proof.outcome }}
          UPLOAD_RESULT: ${{ steps.evidence.outcome }}
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync } from "node:fs";
          for (const key of ["CHECKOUT_RESULT", "NODE_RESULT", "PREFLIGHT_RESULT", "INSTALL_RESULT", "CHROMIUM_RESULT", "PROOF_RESULT", "UPLOAD_RESULT"]) {
            if (process.env[key] !== "success") throw new Error(`Proof failed: ${key}`);
          }
          if (!/^[1-9][0-9]*$/.test(process.env.ARTIFACT_ID ?? "")) throw new Error("Missing exact artifact ID");
          if (!/^[0-9a-f]{64}$/.test(process.env.ARTIFACT_DIGEST ?? "")) throw new Error("Missing exact artifact digest");
          const proof = JSON.parse(readFileSync(".patient-lab-read-proof-results/summary.json", "utf8"));
          if (!proof.completed || !proof.expectedUnitRed || !proof.expectedBrowserRed || !proof.restoredCandidateGreen || proof.failure !== null) {
            throw new Error("Focused/browser counterfactual or restoration evidence is incomplete");
          }
          console.log("Temporary synthetic proof and evidence upload passed. Original full release CI and Production remain unproved.");
          JS
