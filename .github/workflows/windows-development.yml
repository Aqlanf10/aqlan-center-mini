name: Windows development tools

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows_tooling:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      CLINIC_TIME_ZONE: Asia/Aden
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:54329/postgres?sslmode=disable
      TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:54329/aqlan_p1_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - name: Verify selected Node and npm runtime
        run: ./scripts/local.ps1 run verify:environment
      - name: Verify Windows tools, backup integrity, and operational entry guards
        run: >-
          npm test -- --testTimeout 30000
          __tests__/windows-tooling.test.ts
          __tests__/environment-parity.test.ts
          __tests__/verify-ci-orchestrator.test.ts
          __tests__/verification-entry-safety.test.ts
          __tests__/backup-hardening.test.ts
          __tests__/production-backup.test.ts
          __tests__/backup-atomic-retry.test.ts
