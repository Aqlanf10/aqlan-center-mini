# قاعدة PostgreSQL 18 المحلية — طريق التكافؤ مع CI (TD-02 / TD-REG-008).
#
# CI يشغّل اختبارات PostgreSQL الحقيقية على postgres:18-alpine (خدمة الحاوية في
# .github/workflows/ci.yml). هذا الملف يجعل الطريق المحلي إلى الإصدار نفسه سطرًا
# واحدًا بدل «ثبِّت أي PostgreSQL يصادفك» — فاختلاف الإصدار بين الجهاز وCI هو
# بالضبط الدين المسجَّل: عقد المخطط وbaseline يُولَّدان على 18 حصرًا، واختبارات
# التزامن والاستعادة تُثبت سلوك 18، والبوابة ترفض غيره برسالةٍ صريحة.
#
#   docker compose up -d pg18
#   DATABASE_URL=postgresql://ci:ci@127.0.0.1:54329/postgres?sslmode=disable \
#   TEST_DATABASE_URL=postgresql://ci:ci@127.0.0.1:54329/aqlan_p1_test?sslmode=disable \
#     npm run verify:full
#
# (تصحيح مراجعة المالك) الرابطان لهما دوران مختلفان لا يُدمجان:
#   TEST_DATABASE_URL = قاعدة اختبار التكامل (aqlan_p1_test) — تقرؤها اختبارات
#     PostgreSQL الحقيقية واختبارات الأمن وبيان خط الأساس.
#   DATABASE_URL = قاعدة الصيانة (postgres) — تقرؤها الرحلات التشغيلية
#     (كل رحلةٍ تنشئ قاعدتها المؤقتة وتهدمها) وتوليد عقد المخطط.
#
# المنفذ المضيف 54329 عمدًا لا 5432: لا يصطدم بقاعدةٍ محليةٍ منصوبةٍ سابقًا —
# غيّره إن كان مشغولًا لديك. القاعدة والحساب يطابقان خدمة CI حرفيًا (ci/ci
# على aqlan_p1_test) فلا يختلف شيءٌ بين المسارين سوى المنفذ.
#
# الهدم الكامل والبدء من صفر — الصيغة الصحيحة بلا اسم خدمة (الوسم ‎-v يسقط
# الحاويةَ **والـvolume المسمَّى معًا** لكامل مجموعة هذا الملف):
#   docker compose down -v        # يوقف الحاوية ويحذف volume الـpg18-data كله
#   docker compose down            # يوقف الحاوية ويُبقي البيانات في الـvolume
#   docker compose stop pg18       # إيقاف الخدمة وحدها بلا أي حذف
# (دقيقة: docker compose down لا يقبل اسم خدمة وسيطةً — «down -v pg18» ليست
# صيغةً صالحة؛ ‎-v تعني حذف الـvolumes المعرّفة في هذا الملف كلها.)
services:
  pg18:
    image: postgres:18-alpine
    container_name: aqlan-pg18
    environment:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: aqlan_p1_test
    ports:
      - "54329:5432"
    # PostgreSQL 18+ في صور docker الرسمية: PGDATA = /var/lib/postgresql/18/docker،
    # والتركيب يكون على الأب /var/lib/postgresql. التركيب القديم على ‎.../data
    # يجعل الحاوية تخرج برمز 1 عند الإقلاع (P3-10). من كان لديه volume قديم
    # من الإعداد السابق: docker compose down -v ثم up من جديد.
    volumes:
      - pg18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ci -d aqlan_p1_test"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg18-data:
